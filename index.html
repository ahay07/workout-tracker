<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Day Longevity & Strength Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for horizontal tabs on mobile */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="p-2 bg-brand-600/20 text-brand-400 rounded-lg">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight text-slate-100">6-Day Hybrid Routine</h1>
                    <p class="text-xs text-slate-400">Strength & Longevity Tracker</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- CSV Data Actions -->
                <button onclick="exportToCSV()" title="Export CSV" class="flex items-center space-x-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-medium text-slate-200 transition">
                    <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span class="hidden sm:inline">Export CSV</span>
                </button>

                <label class="flex items-center space-x-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-medium text-slate-200 transition cursor-pointer" title="Import CSV">
                    <i data-lucide="upload" class="w-3.5 h-3.5 text-brand-400"></i>
                    <span class="hidden sm:inline">Import</span>
                    <input type="file" id="csvFileInput" accept=".csv" onchange="importFromCSV(event)" class="hidden">
                </label>

                <!-- Quick Rest Timer Trigger -->
                <button id="timerToggleBtn" onclick="toggleTimerModal()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-brand-600/20 hover:bg-brand-600/30 border border-brand-500/30 rounded-lg text-xs font-medium text-brand-300 transition">
                    <i data-lucide="timer" class="w-4 h-4 text-brand-400"></i>
                    <span id="timerDisplay">Rest Timer</span>
                </button>
            </div>
        </div>

        <!-- Days Navigation Tabs -->
        <div class="max-w-3xl mx-auto px-2 pb-2">
            <div class="flex space-x-1 overflow-x-auto no-scrollbar py-1" id="daysNav">
                <!-- Javascript populates tabs here -->
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-6">
        
        <!-- Day Overview Card -->
        <div id="dayHeader" class="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-800 rounded-xl p-4 sm:p-5 shadow-lg">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                    <div class="flex items-center space-x-2">
                        <span id="dayBadge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-brand-500/20 text-brand-300 border border-brand-500/30">
                            Monday
                        </span>
                        <span id="dayDuration" class="text-xs text-slate-400 flex items-center">
                            <i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> 35–45 min
                        </span>
                        <span id="dayLocation" class="text-xs text-slate-400 flex items-center">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1"></i> Gym
                        </span>
                    </div>
                    <h2 id="dayTitle" class="text-xl font-bold mt-2 text-white">Upper Body (Push Focus)</h2>
                </div>
                <!-- Day Progress Meter -->
                <div class="sm:text-right flex sm:flex-col items-center sm:items-end justify-between">
                    <span id="progressText" class="text-xs font-medium text-slate-400">0 of 0 sets done</span>
                    <div class="w-32 bg-slate-700 h-2 rounded-full overflow-hidden mt-1">
                        <div id="progressBar" class="bg-brand-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Warmup Banner -->
        <div id="warmupBox" class="bg-slate-900/60 border border-slate-800/80 rounded-lg p-3 text-sm flex items-start space-x-3 text-slate-300">
            <i data-lucide="flame" class="w-5 h-5 text-amber-500 shrink-0 mt-0.5"></i>
            <div>
                <span class="font-semibold text-slate-200">Warm-up Suggestion:</span>
                <span id="warmupText" class="text-slate-400"> Arm circles, band pull-aparts, light cable rotations.</span>
            </div>
        </div>

        <!-- Exercise Cards List -->
        <div id="exerciseList" class="space-y-4">
            <!-- Exercise items populated by JS -->
        </div>

        <!-- Footer Actions -->
        <div class="pt-4 flex items-center justify-between border-t border-slate-800 text-xs text-slate-500">
            <button onclick="resetCurrentDay()" class="hover:text-slate-300 flex items-center transition">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1"></i> Reset Today
            </button>
            <button onclick="confirmResetWeek()" class="hover:text-rose-400 flex items-center transition">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Reset Full Week
            </button>
        </div>
    </main>

    <!-- Rest Timer Overlay Modal -->
    <div id="timerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl relative">
            <button onclick="toggleTimerModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <h3 class="text-sm font-medium text-slate-400 mb-1">Rest Interval Timer</h3>
            <div id="modalTimerClock" class="text-5xl font-mono font-bold text-white tracking-wider my-4">
                00:60
            </div>
            
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="setTimer(60)" class="py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-semibold text-sm">60s</button>
                <button onclick="setTimer(90)" class="py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-semibold text-sm">90s</button>
                <button onclick="setTimer(120)" class="py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-semibold text-sm">2m</button>
            </div>

            <div class="flex space-x-2">
                <button id="startTimerBtn" onclick="toggleTimerStart()" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-lg font-medium text-sm flex items-center justify-center space-x-1">
                    <i data-lucide="play" class="w-4 h-4"></i> <span>Start</span>
                </button>
                <button onclick="stopTimer()" class="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium text-sm">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Routine Data Structure
        const workoutData = [
            {
                id: 'mon',
                day: 'Monday',
                title: 'Upper Body (Push Focus)',
                duration: '35–45 min',
                location: 'Gym',
                warmup: '3 min: Arm circles, band pull-aparts, or light cable rotations.',
                exercises: [
                    { id: 'm1', name: 'Dumbbell Bench Press', detail: 'Flat or Slight Incline', sets: 3, targetReps: '8–10' },
                    { id: 'm2', name: 'Seated Cable Row / T-Bar Row', detail: 'Keep chest supported to protect spine', sets: 3, targetReps: '8–10' },
                    { id: 'm3', name: 'Seated Overhead Dumbbell Press', detail: 'Maintain core tightness', sets: 3, targetReps: '8–10' },
                    { id: 'm4', name: 'Triceps Cable Pushdown', detail: 'Straight bar or rope attachment', sets: 2, targetReps: '12–15' }
                ]
            },
            {
                id: 'tue',
                day: 'Tuesday',
                title: 'Lower Body & Mobility',
                duration: '35–45 min',
                location: 'Gym',
                warmup: '3 min: 90/90 hip stretches, bodyweight squats with a pause.',
                exercises: [
                    { id: 't1', name: 'Goblet Squat OR Leg Press', detail: 'Focus on full depth and knee tracking', sets: 3, targetReps: '8–10' },
                    { id: 't2', name: 'Romanian Deadlift', detail: 'Dumbbells or Barbell - hinge at hips', sets: 3, targetReps: '8–10' },
                    { id: 't3', name: 'Dumbbell Walking Lunges', detail: 'Reverse lunges option for lower knee stress', sets: 2, targetReps: '8–10 / leg' },
                    { id: 't4', name: 'Standing Calf Raises', detail: 'Pause at peak contraction', sets: 2, targetReps: '15' }
                ]
            },
            {
                id: 'wed',
                day: 'Wednesday',
                title: 'Dedicated Cardio',
                duration: '30–45 min',
                location: 'Gym / Outdoors',
                warmup: '2 min steady activation pace.',
                exercises: [
                    { id: 'w1', name: 'Steady-State Cardio (Zone 2)', detail: 'Rower, Running, or Elliptical. Keep a conversational pace.', sets: 1, targetReps: '30–45 mins' }
                ]
            },
            {
                id: 'thu',
                day: 'Thursday',
                title: 'Upper Body (Pull Focus)',
                duration: '35–45 min',
                location: 'Gym',
                warmup: '3 min: Hang from pull-up bar (30s), light lat pulldowns.',
                exercises: [
                    { id: 'th1', name: 'Lat Pulldown OR Pull-ups', detail: 'Controlled eccentric lowering', sets: 3, targetReps: '8–10' },
                    { id: 'th2', name: 'Flat Bench Dumbbell Row', detail: 'Keep torso parallel to bench', sets: 3, targetReps: '8–10 / side' },
                    { id: 'th3', name: 'Seated Lateral Raises', detail: 'Machine or Dumbbells - shoulder posture', sets: 3, targetReps: '12–15' },
                    { id: 'th4', name: 'Dumbbell Bicep Curls', detail: 'Strict movement without swinging', sets: 2, targetReps: '10–12' }
                ]
            },
            {
                id: 'fri',
                day: 'Friday',
                title: 'Full Body Strength & Core',
                duration: '35–45 min',
                location: 'Gym',
                warmup: '3 min: Cat-cows, bird-dogs, light kettlebell swings.',
                exercises: [
                    { id: 'f1', name: 'Trap Bar / Barbell Deadlift', detail: 'Full-body power & posture', sets: 3, targetReps: '6–8' },
                    { id: 'f2', name: 'Dumbbell Floor Press OR Push-ups', detail: 'Floor press reduces shoulder angle load', sets: 3, targetReps: '10–12' },
                    { id: 'f3', name: 'Kettlebell Farmer\'s Carries', detail: 'Upright spine, tight core, strong grip', sets: 3, targetReps: '40–50 paces' },
                    { id: 'f4', name: 'Plank to Downward Dog', detail: 'Active core & shoulder mobility flow', sets: 2, targetReps: '45 seconds' }
                ]
            },
            {
                id: 'sat',
                day: 'Saturday',
                title: 'Dedicated Cardio',
                duration: '30–45 min',
                location: 'Gym / Outdoors',
                warmup: '2 min light stride or row.',
                exercises: [
                    { id: 's1', name: 'Cardio Session (Cross-Train)', detail: 'Alternate modality from Wednesday (e.g. Run/Elliptical/Row)', sets: 1, targetReps: '30–45 mins' }
                ]
            },
            {
                id: 'sun',
                day: 'Sunday',
                title: 'Rest & Recovery',
                duration: 'All Day',
                location: 'Home',
                warmup: 'Optional light mobility or walk.',
                exercises: [
                    { id: 'su1', name: 'Active Recovery & Stretching', detail: 'Prioritize full rest, foam rolling, or light walking.', sets: 1, targetReps: 'Rest' }
                ]
            }
        ];

        // LocalStorage State Management
        const STORAGE_KEY = 'workout_routine_state_v1';
        let state = {
            currentDayIndex: 0,
            completedSets: {}, 
            exerciseNotes: {}   
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = { ...state, ...JSON.parse(saved) };
                } catch(e) {
                    console.error("Could not parse saved workout state", e);
                }
            }
            const dayNum = new Date().getDay(); 
            const mapDay = [6, 0, 1, 2, 3, 4, 5]; 
            state.currentDayIndex = mapDay[dayNum];
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateDayProgress();
            renderNavTabs();
        }

        // Render Functions
        function renderNavTabs() {
            const navContainer = document.getElementById('daysNav');
            navContainer.innerHTML = '';

            workoutData.forEach((dayData, index) => {
                const isActive = index === state.currentDayIndex;
                
                let totalSets = 0;
                let doneSets = 0;
                dayData.exercises.forEach(ex => {
                    for(let s=1; s<=ex.sets; s++) {
                        totalSets++;
                        if (state.completedSets[`${ex.id}-${s}`]) doneSets++;
                    }
                });
                const isDayComplete = totalSets > 0 && totalSets === doneSets;

                const tab = document.createElement('button');
                tab.onclick = () => switchDay(index);
                tab.className = `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition flex items-center space-x-1.5 ${
                    isActive 
                        ? 'bg-brand-600 text-white shadow-md' 
                        : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700'
                }`;

                tab.innerHTML = `
                    <span>${dayData.day.substring(0, 3)}</span>
                    ${isDayComplete 
                        ? '<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400"></i>' 
                        : (doneSets > 0 ? `<span class="w-1.5 h-1.5 rounded-full bg-brand-400"></span>` : '')
                    }
                `;
                navContainer.appendChild(tab);
            });
            lucide.createIcons();
        }

        function renderDayContent() {
            const dayData = workoutData[state.currentDayIndex];
            
            document.getElementById('dayBadge').innerText = dayData.day;
            document.getElementById('dayTitle').innerText = dayData.title;
            document.getElementById('dayDuration').innerHTML = `<i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> ${dayData.duration}`;
            document.getElementById('dayLocation').innerHTML = `<i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1"></i> ${dayData.location}`;
            document.getElementById('warmupText').innerText = dayData.warmup;

            const listContainer = document.getElementById('exerciseList');
            listContainer.innerHTML = '';

            dayData.exercises.forEach(ex => {
                const noteValue = state.exerciseNotes[ex.id] || '';
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm hover:border-slate-700/80 transition';

                let setBoxesHtml = '';
                for (let s = 1; s <= ex.sets; s++) {
                    const setId = `${ex.id}-${s}`;
                    const isChecked = !!state.completedSets[setId];
                    setBoxesHtml += `
                        <button 
                            onclick="toggleSet('${setId}')" 
                            class="flex-1 py-2 px-3 rounded-lg border text-xs font-semibold flex items-center justify-center space-x-1.5 transition ${
                                isChecked 
                                    ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' 
                                    : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-600'
                            }">
                            <span>Set ${s}</span>
                            <i data-lucide="${isChecked ? 'check-square' : 'square'}" class="w-3.5 h-3.5 ${isChecked ? 'text-emerald-400' : 'text-slate-500'}"></i>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-2">
                        <div>
                            <h3 class="font-bold text-slate-100 text-base">${ex.name}</h3>
                            <p class="text-xs text-slate-400">${ex.detail}</p>
                        </div>
                        <span class="text-xs font-medium bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md self-start sm:self-auto border border-slate-700/50">
                            Target: ${ex.targetReps}
                        </span>
                    </div>

                    <div class="flex space-x-2 my-3">
                        ${setBoxesHtml}
                    </div>

                    <div class="mt-2 pt-2 border-t border-slate-800/80 flex items-center space-x-2">
                        <i data-lucide="notebook-pen" class="w-3.5 h-3.5 text-slate-500 shrink-0"></i>
                        <input 
                            type="text" 
                            placeholder="Log weight / notes (e.g., 45 lbs x 10)..." 
                            value="${noteValue}"
                            onchange="saveNote('${ex.id}', this.value)"
                            class="bg-transparent text-xs text-slate-200 placeholder-slate-600 w-full focus:outline-none focus:border-brand-500 border-b border-transparent py-0.5"
                        />
                    </div>
                `;
                listContainer.appendChild(card);
            });

            updateDayProgress();
            lucide.createIcons();
        }

        function switchDay(index) {
            state.currentDayIndex = index;
            renderNavTabs();
            renderDayContent();
        }

        function toggleSet(setId) {
            state.completedSets[setId] = !state.completedSets[setId];
            saveState();
            renderDayContent();
        }

        function saveNote(exId, value) {
            state.exerciseNotes[exId] = value;
            saveState();
        }

        function updateDayProgress() {
            const dayData = workoutData[state.currentDayIndex];
            let totalSets = 0;
            let doneSets = 0;

            dayData.exercises.forEach(ex => {
                for (let s = 1; s <= ex.sets; s++) {
                    totalSets++;
                    if (state.completedSets[`${ex.id}-${s}`]) doneSets++;
                }
            });

            const percent = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${doneSets} of ${totalSets} sets done`;
        }

        function resetCurrentDay() {
            const dayData = workoutData[state.currentDayIndex];
            dayData.exercises.forEach(ex => {
                for (let s = 1; s <= ex.sets; s++) {
                    delete state.completedSets[`${ex.id}-${s}`];
                }
            });
            saveState();
            renderDayContent();
        }

        function confirmResetWeek() {
            if (confirm("Reset all checkboxes for the week? (Your weight notes will be preserved)")) {
                state.completedSets = {};
                saveState();
                renderNavTabs();
                renderDayContent();
            }
        }

        // CSV Export and Import Logic
        function exportToCSV() {
            const rows = [["Day", "Exercise ID", "Exercise Name", "Target Reps", "Sets Completed", "Total Sets", "Notes/Weight"]];
            
            workoutData.forEach(day => {
                day.exercises.forEach(ex => {
                    let doneSets = 0;
                    for (let s = 1; s <= ex.sets; s++) {
                        if (state.completedSets[`${ex.id}-${s}`]) doneSets++;
                    }
                    const note = state.exerciseNotes[ex.id] || "";
                    rows.push([
                        day.day,
                        ex.id,
                        `"${ex.name.replace(/"/g, '""')}"`,
                        `"${ex.targetReps}"`,
                        doneSets,
                        ex.sets,
                        `"${note.replace(/"/g, '""')}"`
                    ]);
                });
            });

            const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `workout_log_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split("\n");
                if (lines.length <= 1) return;

                // Simple parser for exported CSV notes
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    // Matches standard quoted CSV format
                    const parts = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (parts && parts.length >= 7) {
                        const exId = parts[1].replace(/"/g, '');
                        const note = parts[6].replace(/^"|"$/g, '').replace(/""/g, '"');
                        if (exId && note) {
                            state.exerciseNotes[exId] = note;
                        }
                    }
                }
                saveState();
                renderDayContent();
                alert("Workout notes successfully imported!");
            };
            reader.readAsText(file);
        }

        // Rest Timer Functionality
        let timerInterval = null;
        let timerSecondsLeft = 60;
        let isTimerRunning = false;

        function toggleTimerModal() {
            const modal = document.getElementById('timerModal');
            modal.classList.toggle('hidden');
        }

        function setTimer(seconds) {
            stopTimer();
            timerSecondsLeft = seconds;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSecondsLeft / 60);
            const secs = timerSecondsLeft % 60;
            const text = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('modalTimerClock').innerText = text;
            document.getElementById('timerDisplay').innerText = text;
        }

        function toggleTimerStart() {
            if (isTimerRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timerSecondsLeft <= 0) timerSecondsLeft = 60;
            isTimerRunning = true;
            document.getElementById('startTimerBtn').innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i> <span>Pause</span>';
            lucide.createIcons();

            timerInterval = setInterval(() => {
                timerSecondsLeft--;
                updateTimerDisplay();
                if (timerSecondsLeft <= 0) {
                    stopTimer();
                    playBeep();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            document.getElementById('startTimerBtn').innerHTML = '<i data-lucide="play" class="w-4 h-4"></i> <span>Start</span>';
            lucide.createIcons();
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        // Initialization
        window.onload = function() {
            loadState();
            renderNavTabs();
            renderDayContent();
            updateTimerDisplay();
        };
    </script>
</body>
</html>
